# Ultralytics YOLO 🚀, AGPL-3.0 许可证
# 基于YOLO11的FRFN增强目标检测模型

# 参数设置
nc: 80 # 类别数量
scales: # 模型复合缩放常数，参考官方yolo11设计
  # [深度, 宽度, 最大通道数]
  n: [0.50, 0.25, 1024] # 轻量级：181层风格，2M参数，6.6 GFLOPs
  s: [0.50, 0.50, 1024] # 标准版：181层风格，9M参数，21.7 GFLOPs
  m: [0.50, 1.00, 512]  # 中等版：231层风格，20M参数，68.5 GFLOPs
  l: [1.00, 1.00, 512]  # 大型版：357层风格，25M参数，87.6 GFLOPs
  x: [1.00, 1.50, 512]  # 超大版：357层风格，57M参数，196.0 GFLOPs

# FRFN增强主干网络（参考YOLO11架构）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2_FRFN, [256, False, 0.25, 1, True]]  # 2 替换C3k2为C3k2_FRFN
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2_FRFN, [512, False, 0.25, 1, True]]  # 4 替换C3k2为C3k2_FRFN
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2_FRFN, [512, True, 0.75, 1, True]]    # 6 替换C3k2为C3k2_FRFN，提升扩展比例
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_FRFN, [1024, True, 0.75, 1, True]]   # 8 替换C3k2为C3k2_FRFN，提升扩展比例
  - [-1, 1, SPPF, [1024, 5]]    # 9
  - [-1, 1, C2PSA_CAFM, [1024]] # 10 替换C2PSA为C2PSA_CAFM

# FRFN增强检测头（参考YOLO11架构）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2_FRFN, [512, False, 0.5, 1, True]] # 13 替换C3k2为C3k2_FRFN，提升扩展比例

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2_FRFN, [256, False, 0.5, 1, True]] # 16 (P3/8-small) 替换C3k2为C3k2_FRFN，提升扩展比例

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2_FRFN, [512, False, 0.75, 1, True]] # 19 (P4/16-medium) 替换C3k2为C3k2_FRFN，提升扩展比例

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2_FRFN, [1024, True, 0.75, 1, True]] # 22 (P5/32-large) 替换C3k2为C3k2_FRFN，提升扩展比例

  # 添加额外的注意力增强层提升精度
  - [-1, 1, C2PSA_CAFM, [1024]] # 23 P5级别注意力增强

  - [[16, 19, 23], 1, Detect, [nc]] # Detect(P3, P4, P5) 使用增强后的P5特征